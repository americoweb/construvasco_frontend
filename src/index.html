<!doctype html>
<html lang="pt">
    <head>
        <title>Amazing - Personalização de Produtos e Impressão Personalizada</title>
        <meta charset="utf-8" />
        <meta

        />
        <meta
            name="keywords"
            content="Amazing, personalização, impressão personalizada, produtos personalizados, e-commerce, design, camisetas personalizadas, moçambique, customização"
        />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
        />
        <meta name="author" content="Amazing" />
        <meta name="robots" content="index, follow" />
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Amazing - Personalização de Produtos e Impressão Personalizada" />
        <meta property="og:description" content="Plataforma de e-commerce para personalização de produtos e impressão personalizada. Crie designs únicos, personalize produtos e faça pedidos online." />
        <meta property="og:site_name" content="Amazing" />
        
        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Amazing - Personalização de Produtos e Impressão Personalizada" />
        <meta name="twitter:description" content="Plataforma de e-commerce para personalização de produtos e impressão personalizada. Crie designs únicos, personalize produtos e faça pedidos online." />

        <base href="/" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon-16x16.png" />
        <link rel="icon" type="image/png" href="favicon-32x32.png" />

        <!-- Fonts -->
        <link href="fonts/inter/inter.css" rel="stylesheet" />
        <link href="https://fonts.gstatic.com" rel="preconnect" />

        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />

        <!-- Cross-Origin-Opener-Policy: Allow OAuth popups to communicate -->

        <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none"/>

        <!-- Google Identity Services -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>

        <!-- Splash screen styles -->
        <link href="styles/splash-screen.css" rel="stylesheet" />

    <body>
        <!-- Splash screen -->
        <fuse-splash-screen>
            <img src="images/logo/logo.svg" alt="Fuse logo" />
            <div class="spinner">

                <div class="bounce2"></div>
                <div class="bounce3"></div>
