<div class="page-header">
  <div class="flex flex-col space-y-4">
    <!-- Breadcrumbs -->
    <div *ngIf="breadcrumbs.length > 0">
      <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
    </div>

    <!-- Title + actions -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex-1 min-w-0">
        <h1 class="page-header__title sm:truncate">
          {{ title }}
        </h1>
        <p *ngIf="subtitle" class="page-header__subtitle">
          {{ subtitle }}
        </p>
      </div>

      <div class="page-header__actions flex flex-wrap items-center gap-2 sm:justify-end">
        <button
          *ngIf="showRefresh || showFilters || showSearch"
          type="button"
          class="page-header__icon-btn"
          [disabled]="loading"
          (click)="onRefresh()"
          [attr.aria-label]="'Actualizar'">
          <mat-icon [class.animate-spin]="loading">refresh</mat-icon>
        </button>

        <div *ngIf="showViewToggle && viewOptions.length > 0" class="page-header__view-toggle">
          <button
            *ngFor="let option of viewOptions; trackBy: trackByValue"
            type="button"
            class="page-header__view-toggle-btn"
            [class.page-header__view-toggle-btn--active]="currentView === option.value"
            (click)="onViewChange(option.value)">
            <mat-icon class="page-header__view-toggle-icon">{{ option.icon }}</mat-icon>
            <span class="ml-2 hidden sm:inline">{{ option.label }}</span>
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <app-button
            *ngFor="let action of actions"
            size="sm"
            [variant]="action.variant || 'primary'"
            [icon]="action.icon"
            [disabled]="action.disabled"
            (onClick)="onActionClick(action)">
            {{ action.label }}
          </app-button>
        </div>
      </div>
    </div>

    <!-- Search + filters -->
    <div
      *ngIf="showSearch || showFilters"
      class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div *ngIf="showSearch" class="page-header__search-field w-full sm:flex-1 max-w-lg">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-header__search-mat w-full">
          <mat-icon matPrefix class="page-header__search-prefix">search</mat-icon>
          <input
            matInput
            type="text"
            [placeholder]="searchPlaceholder"
            [ngModel]="searchValue"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onSearchChange($event)" />
        </mat-form-field>
      </div>

      <div *ngIf="showFilters" class="flex items-center">
        <button type="button" class="page-header__filter-btn" (click)="onFilterToggle()">
          <mat-icon class="page-header__filter-icon">filter_list</mat-icon>
          Filtros
        </button>
      </div>
    </div>

    <div class="content-slot">
      <ng-content></ng-content>
    </div>
  </div>
</div>
