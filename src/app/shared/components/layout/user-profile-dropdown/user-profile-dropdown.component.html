<div class="user-profile-dropdown relative">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
    <!-- Profile Photo -->
    <div class="relative">
      <img
        *ngIf="getAvatarUrl()"
        [src]="getAvatarUrl()"
        [alt]="user?.name || 'User'"
        class="w-10 h-10 rounded-full object-cover border-2 border-gray-300"
        (error)="$event.target.style.display='none'">
      <div
        *ngIf="!getAvatarUrl()"
        class="w-10 h-10 rounded-full border-2 border-gray-300 bg-gray-200 flex items-center justify-center text-gray-600 font-semibold text-sm">
        {{ (user?.name || 'U').substring(0, 2).toUpperCase() }}
      </div>
    </div>
    
    <!-- User Info (Desktop Only) -->
    <div class="hidden md:block text-left">
      <div class="text-sm font-semibold text-gray-900">{{ user?.name || 'Usuário' }}</div>
      <div class="text-xs text-gray-500">Minha Conta</div>
    </div>
    
    <!-- Dropdown Arrow -->
    <svg
      class="w-4 h-4 text-gray-500 transition-transform"
      [class.rotate-180]="isOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isOpen"
    class="absolute right-0 mt-2 w-72 bg-white rounded-lg shadow-2xl border border-gray-200 py-2 z-50 animate-slide-down">
    
    <!-- Header Section -->
    <div class="px-4 py-3 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <img
          *ngIf="getAvatarUrl()"
          [src]="getAvatarUrl()"
          [alt]="user?.name || 'User'"
          class="w-12 h-12 rounded-full object-cover border-2 border-gray-300"
          (error)="$event.target.style.display='none'">
        <div
          *ngIf="!getAvatarUrl()"
          class="w-12 h-12 rounded-full border-2 border-gray-300 bg-gray-200 flex items-center justify-center text-gray-600 font-semibold">
          {{ (user?.name || 'U').substring(0, 2).toUpperCase() }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-gray-900 truncate">{{ user?.name || 'Usuário' }}</div>
          <div class="text-xs text-gray-500 truncate">{{ user?.email || user?.identifier || '' }}</div>
        </div>
      </div>
    </div>

    <!-- Menu Items -->
    <div class="py-1">
      <button
        (click)="navigateToAccount()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Minha Conta</span>
      </button>

      <button
        (click)="navigateToOrders()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-green-50 hover:text-green-600 transition-colors">
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <span>Meus Pedidos</span>
      </button>

      <button
        (click)="navigateToAddresses()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
        <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Endereços</span>
      </button>

      <button
        (click)="navigateToSettings()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Definições</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-200 my-1"></div>

    <!-- Logout Button -->
    <div class="px-2">
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </div>
</div>
