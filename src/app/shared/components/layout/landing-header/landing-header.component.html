<header *ngIf="!isAuthenticated" [class]="useSolidHeader ? 'w-full fixed top-0 z-50 transition-all duration-300 bg-white/95 backdrop-blur-md border-b border-slate-200' : 'w-full fixed top-0 z-50 transition-all duration-300 bg-transparent'">
  <div class="w-full max-w-[1320px] mx-auto px-4 sm:px-6 lg:px-8 py-3">
    <div *ngIf="isHeaderLoading" class="hidden md:flex justify-between items-center h-16 animate-pulse" aria-hidden="true">
      <div class="h-10 w-32 rounded-full bg-slate-200"></div>
      <div class="h-12 w-[520px] rounded-full bg-slate-200"></div>
      <div class="h-10 w-48 rounded-full bg-slate-200"></div>
    </div>

    <div *ngIf="!isHeaderLoading" class="hidden md:flex items-center justify-between gap-4">
      <a routerLink="/" [class]="useSolidHeader ? 'flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-2 shadow-sm' : 'flex items-center gap-2 px-1 py-2'">
        <img src="images/logo/logo.svg" alt="Construvasco" class="h-8 w-auto" />
        <span [class]="useSolidHeader ? 'text-sm font-semibold text-slate-900' : 'text-sm font-semibold text-white'">Construvasco</span>
      </a>

      <nav [class]="useSolidHeader ? 'flex items-center gap-1 rounded-full border border-slate-200 bg-white px-2 py-1 shadow-sm' : 'flex items-center gap-1 px-2 py-1'">
        <a routerLink="/" [class]="navItemClasses + (useSolidHeader ? ' px-3 py-2 rounded-full hover:bg-slate-100' : ' px-3 py-2 text-white/90 hover:text-white')">Home</a>
        <a routerLink="/produtos" [class]="navItemClasses + (useSolidHeader ? ' px-3 py-2 rounded-full hover:bg-slate-100' : ' px-3 py-2 text-white/90 hover:text-white')">Projetos</a>
        <a routerLink="/checkout" [class]="navItemClasses + (useSolidHeader ? ' px-3 py-2 rounded-full hover:bg-slate-100' : ' px-3 py-2 text-white/90 hover:text-white')">Como Funciona</a>
        <a routerLink="/produtos" [class]="navItemClasses + (useSolidHeader ? ' px-3 py-2 rounded-full hover:bg-slate-100' : ' px-3 py-2 text-white/90 hover:text-white')">Portfólio</a>
        <a routerLink="/checkout" [class]="navItemClasses + (useSolidHeader ? ' px-3 py-2 rounded-full hover:bg-slate-100' : ' px-3 py-2 text-white/90 hover:text-white')">Contacto</a>
      </nav>

      <div class="flex items-center gap-3">
        <button (click)="openCart()" [class]="useSolidHeader ? 'relative rounded-full border border-slate-200 bg-white p-2 text-slate-600 hover:text-slate-900 transition-colors' : 'relative rounded-full border border-white/40 bg-black/20 p-2 text-white hover:bg-black/30 transition-colors'" aria-label="Abrir carrinho">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span *ngIf="cartItemCount > 0" class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-medium text-white">
            {{ cartItemCount }}
          </span>
        </button>
        <div *ngIf="!isAuthenticated">
          <button (click)="openLogin()" [class]="useSolidHeader ? 'rounded-full bg-slate-900 text-white px-5 py-2 text-sm font-semibold hover:bg-slate-800 transition-colors' : 'rounded-sm bg-[#F2C94C] text-slate-900 px-5 py-2 text-sm font-semibold hover:bg-[#ffd85f] transition-colors'">Entrar</button>
        </div>
        <div *ngIf="isAuthenticated">
          <app-user-profile-dropdown></app-user-profile-dropdown>
        </div>
      </div>
    </div>

    <!-- Mobile Header shimmer -->
    <div *ngIf="isHeaderLoading" class="md:hidden flex justify-between items-center h-16 animate-pulse" aria-hidden="true">
      <div class="h-10 w-28 rounded-lg bg-slate-200"></div>
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-lg bg-slate-200"></div>
        <div class="h-9 w-9 rounded-lg bg-slate-200"></div>
        <div class="h-9 w-9 rounded-lg bg-slate-200"></div>
      </div>
    </div>

    <!-- Mobile Header -->
    <div *ngIf="!isHeaderLoading" class="md:hidden flex justify-between items-center h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center">
        <img src="images/logo/logo.svg" alt="Construvasco" class="h-10 w-auto" />
      </a>

      <!-- Mobile Actions -->
      <div class="flex items-center space-x-3">
        <button 
          (click)="openCart()"
          class="relative p-2 text-gray-500 hover:text-indigo-600 transition-colors rounded-full border border-slate-200 bg-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span *ngIf="cartItemCount > 0" class="absolute top-0 right-0 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-medium text-white">
            {{ cartItemCount }}
          </span>
        </button>

        <!-- Profile or Login -->
        <div *ngIf="!isAuthenticated">
          <button (click)="openLogin()" class="rounded-full bg-slate-900 text-white px-4 py-2 text-sm font-semibold">Entrar</button>
        </div>
        <div *ngIf="isAuthenticated">
          <app-user-profile-dropdown></app-user-profile-dropdown>
        </div>

        <!-- Hamburger Menu -->
        <button
          (click)="toggleMobileMenu()"
          class="p-2 text-gray-500 hover:text-gray-700 transition-colors">
          <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-gray-200 py-4">
      <!-- Mobile Search -->
      <div class="px-4 mb-4">
        <div class="relative">
          <input
            type="text"
            [(ngModel)]="mobileSearchQuery"
            (keyup.enter)="onMobileSearch($event)"
            placeholder="Buscar projectos..."
            class="w-full px-4 py-2 pl-10 pr-10 border border-gray-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm min-h-[44px]">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <button
            (click)="onMobileSearch()"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-blue-600 transition-colors"
            aria-label="Buscar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>
      
      <nav class="flex flex-col space-y-2">
        <a routerLink="/" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Home</a>
        <a routerLink="/produtos" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Projetos</a>
        <a routerLink="/checkout" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Como Funciona</a>
        <a routerLink="/produtos" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Portfólio</a>
        <a routerLink="/checkout" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Contacto</a>
      </nav>
    </div>
  </div>
</header>

<!-- Cart Popup -->
<app-cart-popup 
  [isOpen]="isCartOpen" 
  (close)="closeCart()">
</app-cart-popup>

<!-- Auth Modals -->
<div *ngIf="currentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 sm:p-6" (click)="closeModal()">
  <div (click)="$event.stopPropagation()" class="relative">
    <app-login-modal
      *ngIf="currentModal === 'login'"
      (close)="closeModal()"
      (switchToRegister)="switchToRegister()">
    </app-login-modal>
    
    <app-register-modal
      *ngIf="currentModal === 'register'"
      (close)="closeModal()"
      (switchToLogin)="switchToLogin()">
    </app-register-modal>
  </div>
</div>
