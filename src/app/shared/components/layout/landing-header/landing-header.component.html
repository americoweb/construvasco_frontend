<header class="bg-white/80 backdrop-blur-lg shadow-sm w-full sticky top-0 z-50">
  <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Desktop Header -->
    <div class="hidden md:flex justify-between items-center h-20">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="flex items-center">
          <img src="https://i.ibb.co/XZs0Cf8D/amazinglogo.jpg" alt="Logotipo da Aplicação" class="h-12 w-auto" />
        </a>
      </div>

      <!-- Navigation Links -->
      <nav class="flex items-center space-x-8">
        <a routerLink="/" [class]="navItemClasses">Home</a>
        <a routerLink="/produtos" [class]="navItemClasses">Produtos</a>
        <a routerLink="/produtos" [class]="navItemClasses">Categorias</a>
      </nav>
      
      <!-- Right Side Actions -->
      <div class="flex items-center space-x-4">
        <!-- Search Bar -->
        <div class="hidden lg:block relative">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch($event)"
            placeholder="Buscar produtos..."
            class="w-64 px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <button
            (click)="onSearch()"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-blue-600 transition-colors"
            aria-label="Buscar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>

        <!-- Phone Number (Clickable) -->
        <a
          (click)="callPhone()"
          class="hidden lg:flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
          <span class="text-sm font-medium">{{ phoneNumber }}</span>
        </a>

        <!-- WhatsApp Button -->
        <button
          (click)="openWhatsApp('help')"
          class="hidden lg:flex items-center gap-2 px-4 py-2 bg-[#25D366] text-white rounded-lg hover:bg-[#20BA5A] transition-colors font-medium text-sm">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.77.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          <span>WhatsApp</span>
        </button>

        <!-- Shopping Cart -->
        <button 
          (click)="openCart()"
          class="relative text-gray-500 hover:text-indigo-600 transition-colors"
          aria-label="Abrir carrinho">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span *ngIf="cartItemCount > 0" class="absolute -top-1 -right-2 flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-xs font-medium text-white">
            {{ cartItemCount }}
          </span>
        </button>

        <!-- Login Button or User Profile -->
        <div *ngIf="!isAuthenticated">
          <button
            (click)="openLogin()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium text-sm">
            Entrar
          </button>
        </div>
        <div *ngIf="isAuthenticated">
          <app-user-profile-dropdown></app-user-profile-dropdown>
        </div>
      </div>
    </div>

    <!-- Mobile Header -->
    <div class="md:hidden flex justify-between items-center h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center">
        <img src="https://i.ibb.co/XZs0Cf8D/amazinglogo.jpg" alt="Logo" class="h-10 w-auto" />
      </a>

      <!-- Mobile Actions -->
      <div class="flex items-center space-x-3">
        <!-- WhatsApp Icon -->
        <button
          (click)="openWhatsApp('help')"
          class="p-2 text-[#25D366] hover:bg-gray-100 rounded-lg transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.77.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
        </button>

        <!-- Cart Icon -->
        <button 
          (click)="openCart()"
          class="relative p-2 text-gray-500 hover:text-indigo-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span *ngIf="cartItemCount > 0" class="absolute top-0 right-0 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-xs font-medium text-white text-[10px]">
            {{ cartItemCount }}
          </span>
        </button>

        <!-- Profile or Login -->
        <div *ngIf="!isAuthenticated">
          <button
            (click)="openLogin()"
            class="p-2 text-gray-500 hover:text-blue-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
        </div>
        <div *ngIf="isAuthenticated">
          <app-user-profile-dropdown></app-user-profile-dropdown>
        </div>

        <!-- Hamburger Menu -->
        <button
          (click)="toggleMobileMenu()"
          class="p-2 text-gray-500 hover:text-gray-700 transition-colors">
          <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-gray-200 py-4">
      <!-- Mobile Search -->
      <div class="px-4 mb-4">
        <div class="relative">
          <input
            type="text"
            [(ngModel)]="mobileSearchQuery"
            (keyup.enter)="onMobileSearch($event)"
            placeholder="Buscar produtos..."
            class="w-full px-4 py-2 pl-10 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm min-h-[44px]">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <button
            (click)="onMobileSearch()"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-blue-600 transition-colors"
            aria-label="Buscar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>
      
      <nav class="flex flex-col space-y-2">
        <a routerLink="/" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Home</a>
        <a routerLink="/produtos" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Produtos</a>
        <a routerLink="/produtos" [class]="navItemClasses + ' px-4 py-2'" (click)="toggleMobileMenu()">Categorias</a>
      </nav>
    </div>
  </div>
</header>

<!-- Cart Popup -->
<app-cart-popup 
  [isOpen]="isCartOpen" 
  (close)="closeCart()">
</app-cart-popup>

<!-- Auth Modals -->
<div *ngIf="currentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" (click)="closeModal()">
  <div (click)="$event.stopPropagation()" class="relative">
    <app-login-modal
      *ngIf="currentModal === 'login'"
      (close)="closeModal()"
      (switchToRegister)="switchToRegister()"
      (switchToForgotPassword)="switchToForgotPassword()">
    </app-login-modal>
    
    <app-register-modal
      *ngIf="currentModal === 'register'"
      (close)="closeModal()"
      (switchToLogin)="switchToLogin()">
    </app-register-modal>
    
    <app-forgot-password-modal
      *ngIf="currentModal === 'forgot-password'"
      (close)="closeModal()"
      (switchToLogin)="switchToLogin()">
    </app-forgot-password-modal>
  </div>
</div>
