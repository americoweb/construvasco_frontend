<div class="register-modal">
  <!-- Close Button -->
  <button 
    type="button"
    class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
    (click)="closeModal()"
    aria-label="Fechar">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Logo -->
  <div class="flex justify-center mb-6">
    <img src="images/logo/logo.svg" alt="Construvasco" class="h-12 w-auto" />
  </div>

  <!-- Heading -->
  <div class="text-center mb-2">
    <h2 class="text-2xl font-bold text-gray-900">Criar Conta</h2>
    <p class="text-sm text-gray-600 mt-1">Registe-se para começar</p>
  </div>

  <!-- Error Alert -->
  <div *ngIf="showError && errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
    <p class="text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <!-- Google Sign-Up Button -->
  <div class="mb-6">
    <button
      type="button"
      (click)="renderGoogleButton()"
      class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-white border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition-colors font-medium text-gray-700">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Criar conta com Google</span>
    </button>
    <div id="googleSignUpButtonModal" class="mt-2"></div>
  </div>

  <!-- Divider -->
  <div class="flex items-center mb-6">
    <div class="flex-1 border-t border-gray-300"></div>
    <span class="px-3 text-sm text-gray-500">ou</span>
    <div class="flex-1 border-t border-gray-300"></div>
  </div>

  <!-- Register Form -->
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
        Nome Completo
      </label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
        placeholder="Seu nome completo"
        autocomplete="name">
      <p *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('name') }}
      </p>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        placeholder="seu@email.com"
        autocomplete="email">
      <p *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('email') }}
      </p>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
        Senha
      </label>
      <div class="relative">
        <input
          id="password"
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
          [class.border-red-500]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password">
        <button
          type="button"
          (click)="hidePassword = !hidePassword"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
          <svg *ngIf="hidePassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="!hidePassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>
      <p *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('password') }}
      </p>
    </div>

    <!-- Confirm Password Field -->
    <div>
      <label for="password_confirmation" class="block text-sm font-medium text-gray-700 mb-1">
        Confirmar Senha
      </label>
      <div class="relative">
        <input
          id="password_confirmation"
          [type]="hideConfirmPassword ? 'password' : 'text'"
          formControlName="password_confirmation"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
          [class.border-red-500]="getPasswordMismatchError() || (registerForm.get('password_confirmation')?.invalid && registerForm.get('password_confirmation')?.touched)"
          placeholder="Confirme sua senha"
          autocomplete="new-password">
        <button
          type="button"
          (click)="hideConfirmPassword = !hideConfirmPassword"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
          <svg *ngIf="hideConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="!hideConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>
      <p *ngIf="getPasswordMismatchError()" class="mt-1 text-sm text-red-600">
        As senhas não coincidem
      </p>
      <p *ngIf="registerForm.get('password_confirmation')?.hasError('required') && registerForm.get('password_confirmation')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('password_confirmation') }}
      </p>
    </div>

    <!-- Terms Checkbox -->
    <div>
      <label class="flex items-start gap-2">
        <input
          type="checkbox"
          formControlName="accept_terms"
          class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
        <span class="text-sm text-gray-600">
          Aceito os 
          <a href="#" class="text-blue-600 hover:underline">Termos e Condições</a>
        </span>
      </label>
      <p *ngIf="registerForm.get('accept_terms')?.hasError('requiredTrue') && registerForm.get('accept_terms')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('accept_terms') }}
      </p>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading || registerForm.invalid"
      class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2">
      <span *ngIf="!isLoading">Criar Conta</span>
      <span *ngIf="isLoading" class="flex items-center gap-2">
        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Criando conta...
      </span>
    </button>
  </form>

  <!-- Bottom Section -->
  <div class="mt-6 pt-6 border-t border-gray-200 text-center">
    <p class="text-sm text-gray-600">
      Já tem conta?
      <button
        type="button"
        (click)="onSwitchToLogin()"
        class="text-blue-600 font-semibold hover:text-blue-700 hover:underline ml-1">
        Entrar
      </button>
    </p>
  </div>
</div>
