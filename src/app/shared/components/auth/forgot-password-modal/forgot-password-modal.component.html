<div class="forgot-password-modal">
  <!-- Close Button -->
  <button 
    type="button"
    class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
    (click)="closeModal()"
    aria-label="Fechar">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Heading -->
  <div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-gray-900">Recuperar Senha</h2>
    <p class="text-sm text-gray-600 mt-2">
      Digite seu email e enviaremos um link de recuperação
    </p>
  </div>

  <!-- Success Alert -->
  <div *ngIf="showSuccess && successMessage" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg">
    <p class="text-sm text-green-600">{{ successMessage }}</p>
  </div>

  <!-- Error Alert -->
  <div *ngIf="showError && errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
    <p class="text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <!-- Form -->
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Field -->
    <div>
      <label for="identifier" class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input
        id="identifier"
        type="email"
        formControlName="identifier"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="forgotPasswordForm.get('identifier')?.invalid && forgotPasswordForm.get('identifier')?.touched"
        placeholder="seu@email.com"
        autocomplete="email">
      <p *ngIf="forgotPasswordForm.get('identifier')?.invalid && forgotPasswordForm.get('identifier')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('identifier') }}
      </p>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading || forgotPasswordForm.invalid"
      class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2">
      <span *ngIf="!isLoading">Enviar Link</span>
      <span *ngIf="isLoading" class="flex items-center gap-2">
        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Enviando...
      </span>
    </button>
  </form>

  <!-- Bottom Section -->
  <div class="mt-6 pt-6 border-t border-gray-200 text-center">
    <button
      type="button"
      (click)="onSwitchToLogin()"
      class="text-sm text-blue-600 hover:text-blue-700 hover:underline">
      Voltar ao Login
    </button>
  </div>
</div>
