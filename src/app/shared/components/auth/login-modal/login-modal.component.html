<div class="login-modal">
  <!-- Close Button -->
  <button 
    type="button"
    class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
    (click)="closeModal()"
    aria-label="Fechar">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Logo -->
  <div class="flex justify-center mb-6">
    <img src="https://i.ibb.co/XZs0Cf8D/amazinglogo.jpg" alt="Logo" class="h-12 w-auto" />
  </div>

  <!-- Heading -->
  <div class="text-center mb-2">
    <h2 class="text-2xl font-bold text-gray-900">Bem-vindo de volta!</h2>
    <p class="text-sm text-gray-600 mt-1">Entre na sua conta</p>
  </div>

  <!-- Error Alert -->
  <div *ngIf="showError && errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
    <p class="text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <!-- Google Sign-In Button -->
  <div class="mb-6">
    <div id="googleSignInButtonModal"></div>
  </div>

  <!-- Divider -->
  <div class="flex items-center mb-6">
    <div class="flex-1 border-t border-gray-300"></div>
    <span class="px-3 text-sm text-gray-500">ou</span>
    <div class="flex-1 border-t border-gray-300"></div>
  </div>

  <!-- Login Form -->
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Field -->
    <div>
      <label for="identifier" class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input
        id="identifier"
        type="email"
        formControlName="identifier"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="signInForm.get('identifier')?.invalid && signInForm.get('identifier')?.touched"
        placeholder="seu@email.com"
        autocomplete="email">
      <p *ngIf="signInForm.get('identifier')?.invalid && signInForm.get('identifier')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('identifier') }}
      </p>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
        Senha
      </label>
      <div class="relative">
        <input
          id="password"
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
          [class.border-red-500]="signInForm.get('password')?.invalid && signInForm.get('password')?.touched"
          placeholder="Sua senha"
          autocomplete="current-password">
        <button
          type="button"
          (click)="hidePassword = !hidePassword"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
          <svg *ngIf="hidePassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="!hidePassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>
      <p *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched" 
         class="mt-1 text-sm text-red-600">
        {{ getErrorMessage('password') }}
      </p>
    </div>

    <!-- Forgot Password Link -->
    <div class="flex justify-end">
      <button
        type="button"
        (click)="onSwitchToForgotPassword()"
        class="text-sm text-blue-600 hover:text-blue-700 hover:underline">
        Esqueceu a senha?
      </button>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading || signInForm.invalid"
      class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2">
      <span *ngIf="!isLoading">Entrar</span>
      <span *ngIf="isLoading" class="flex items-center gap-2">
        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Entrando...
      </span>
    </button>
  </form>

  <!-- Bottom Section -->
  <div class="mt-6 pt-6 border-t border-gray-200 text-center">
    <p class="text-sm text-gray-600">
      Não tem conta?
      <button
        type="button"
        (click)="onSwitchToRegister()"
        class="text-blue-600 font-semibold hover:text-blue-700 hover:underline ml-1">
        Criar Conta
      </button>
    </p>
  </div>
</div>
