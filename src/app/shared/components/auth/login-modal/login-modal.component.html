<div class="login-modal">
  <!-- Close Button -->
  <button 
    type="button"
    mat-icon-button
    class="absolute top-4 right-4 !text-gray-400 hover:!text-gray-600"
    (click)="closeModal()"
    aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>

  <!-- Logo -->
  <div class="flex justify-center mb-6">
    <img src="images/logo/logo.svg" alt="Construvasco" class="h-12 w-auto" />
  </div>

  <!-- Heading -->
  <div class="text-center mb-2">
    <h2 class="text-2xl font-bold text-gray-900">Bem-vindo de volta!</h2>
    <p class="text-sm text-gray-600 mt-1">Entre na sua conta</p>
  </div>

  <!-- Error Alert -->
  <div *ngIf="showError && errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
    <p class="text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <!-- Google Sign-In Button -->
  <div class="mb-6">
    <div id="googleSignInButtonModal"></div>
  </div>

  <!-- Divider -->
  <div class="flex items-center mb-6">
    <div class="flex-1 border-t border-gray-300"></div>
    <span class="px-3 text-sm text-gray-500">ou</span>
    <div class="flex-1 border-t border-gray-300"></div>
  </div>

  <!-- Login Form -->
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email Field -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Email</mat-label>
      <input
        matInput
        id="identifier"
        type="email"
        formControlName="identifier"
        placeholder="seu@email.com"
        autocomplete="email" />
      <mat-error *ngIf="signInForm.get('identifier')?.invalid && signInForm.get('identifier')?.touched">
        {{ getErrorMessage('identifier') }}
      </mat-error>
    </mat-form-field>

    <!-- Password Field -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Senha</mat-label>
      <input
        matInput
        id="password"
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        placeholder="Sua senha"
        autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" [attr.aria-label]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'">
        <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-error *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched">
        {{ getErrorMessage('password') }}
      </mat-error>
    </mat-form-field>

    <!-- Hint: password change only after login (Conta > Definições) -->
    <p class="text-xs text-gray-500 text-right leading-snug">
      Para alterar a palavra-passe, inicie sessão e use <span class="font-medium">Conta</span> → <span class="font-medium">Definições</span>.
    </p>

    <!-- Submit Button -->
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="isLoading || signInForm.invalid"
      class="w-full !py-3 !font-semibold !rounded-lg !flex !items-center !justify-center gap-2">
      <span *ngIf="!isLoading">Entrar</span>
      <span *ngIf="isLoading" class="flex items-center gap-2">
        <mat-progress-spinner mode="indeterminate" diameter="18" strokeWidth="3"></mat-progress-spinner>
        Entrando...
      </span>
    </button>
  </form>

  <!-- Bottom Section -->
  <div class="mt-6 pt-6 border-t border-gray-200 text-center">
    <p class="text-sm text-gray-600">
      Não tem conta?
      <button
        mat-button
        type="button"
        (click)="onSwitchToRegister()"
        class="!text-blue-600 !font-semibold hover:!text-blue-700 !ml-1">
        Criar Conta
      </button>
    </p>
  </div>
</div>
