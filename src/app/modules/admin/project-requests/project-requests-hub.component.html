<div class="stf-req-hub">
  <header class="stf-req-hub__hero">
    <span class="stf-req-hub__eyebrow">Operação</span>
    <h1 class="stf-req-hub__title">Pedidos de projecto</h1>
    <p class="stf-req-hub__sub">Briefings, orçamentos e acompanhamento comercial.</p>
  </header>

  <nav class="stf-req-hub__tabs" aria-label="Secções de pedidos">
    <a mat-stroked-button routerLink="lista" routerLinkActive #rlaLista="routerLinkActive" [class.stf-req-hub__tab--active]="rlaLista.isActive">
      <mat-icon svgIcon="heroicons_outline:list-bullet" />
      Lista
    </a>
    <a mat-stroked-button routerLink="novo" routerLinkActive #rlaNovo="routerLinkActive" [class.stf-req-hub__tab--active]="rlaNovo.isActive">
      <mat-icon svgIcon="heroicons_outline:plus-circle" />
      Novo pedido
    </a>
  </nav>

  <router-outlet />
</div>
