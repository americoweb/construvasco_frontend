<div class="order-status-update-dialog p-6">
  <h2 class="text-xl font-semibold text-gray-900 mb-2">
    Atualizar Status do Pedido
  </h2>
  <p class="text-sm text-gray-600 mb-6">
    Pedido: <span class="font-mono font-semibold">#{{ data.orderNumber }}</span>
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="space-y-4">
      <!-- Current Status -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Status Atual
        </label>
        <div class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
             [ngClass]="{
               'bg-yellow-100 text-yellow-800': getStatusColor(data.currentStatus) === 'yellow',
               'bg-blue-100 text-blue-800': getStatusColor(data.currentStatus) === 'blue',
               'bg-orange-100 text-orange-800': getStatusColor(data.currentStatus) === 'orange',
               'bg-purple-100 text-purple-800': getStatusColor(data.currentStatus) === 'purple',
               'bg-green-100 text-green-800': getStatusColor(data.currentStatus) === 'green',
               'bg-red-100 text-red-800': getStatusColor(data.currentStatus) === 'red',
               'bg-gray-100 text-gray-800': getStatusColor(data.currentStatus) === 'gray'
             }">
          {{ currentStatusLabel }}
        </div>
      </div>

      <!-- New Status -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Novo Status</mat-label>
        <mat-select formControlName="status" required>
          <mat-option *ngFor="let status of availableStatuses; trackBy: trackByStatus" [value]="status.value">
            <span class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full"
                    [ngClass]="{
                      'bg-yellow-500': status.color === 'yellow',
                      'bg-blue-500': status.color === 'blue',
                      'bg-orange-500': status.color === 'orange',
                      'bg-purple-500': status.color === 'purple',
                      'bg-green-500': status.color === 'green',
                      'bg-red-500': status.color === 'red',
                      'bg-gray-500': status.color === 'gray'
                    }"></span>
              {{ status.label }}
            </span>
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('status')?.hasError('required')">
          Status é obrigatório
        </mat-error>
        <mat-hint *ngIf="availableStatuses.length === 0" class="text-red-600">
          Nenhum status disponível para transição
        </mat-hint>
      </mat-form-field>

      <!-- Notes -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Observações (opcional)</mat-label>
        <textarea matInput 
                  formControlName="notes" 
                  rows="3"
                  placeholder="Adicione observações sobre a mudança de status..."></textarea>
      </mat-form-field>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 mt-6">
      <button type="button" 
              mat-button 
              (click)="onCancel()">
        Cancelar
      </button>
      <button type="submit" 
              mat-raised-button 
              color="primary"
              [disabled]="!form.valid || form.value.status === data.currentStatus">
        Atualizar Status
      </button>
    </div>
  </form>
</div>
