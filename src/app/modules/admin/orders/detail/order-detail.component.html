<div class="order-detail-container w-full">
  <app-page-header
    [title]="order?.order_number || 'Carregando...'"
    [subtitle]="'Detalhes do pedido'"
    [breadcrumbs]="breadcrumbs"
    [actions]="pageHeaderActions"
    [loading]="loading">
  </app-page-header>

  <div class="mx-auto px-4 py-6" *ngIf="!loading && order">
    <app-order-detail-panel
      [order]="order"
      [embedded]="false"
      (orderUpdated)="onOrderUpdated($event)">
    </app-order-detail-panel>
  </div>

  <div *ngIf="loading" class="mx-auto px-4 py-6 w-full">
    <app-loading></app-loading>
  </div>
</div>
