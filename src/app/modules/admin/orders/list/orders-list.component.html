<div class="orders-list-container w-full">
  <app-page-header
    [title]="'Pedidos'"
    [subtitle]="'Gerencie seus pedidos'"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar pedidos...'"
    [searchValue]="searchValue"
    [showFilters]="true"
    [actions]="pageHeaderActions"
    [loading]="loading"
    (searchChange)="onSearchChange($event)"
    (filterToggle)="onFilterToggle()"
    (refresh)="onRefresh()">
  </app-page-header>

  <div class="container mx-auto px-4 py-3">
    <!-- Filters -->
    <div class="mb-3">
      <app-data-filters
        [fields]="filterFields"
        [initialValues]="filters"
        (filtersChange)="onFiltersChange($event)">
      </app-data-filters>
    </div>

    <!-- Orders Table -->
    <app-data-table
      [data]="orders"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading"
      [emptyMessage]="'Nenhum pedido encontrado'"
      (rowClick)="viewOrder($event)">
    </app-data-table>

    <!-- Pagination -->
    <div class="mt-2">
      <app-pagination
        [pagination]="pagination"
        [pageSizeOptions]="[10, 15, 25, 50]"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
