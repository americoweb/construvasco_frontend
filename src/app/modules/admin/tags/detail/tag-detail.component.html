<div class="tag-detail-container">
  <app-page-header
    [title]="tag?.name || 'Tag'"
    [breadcrumbs]="[
      { label: 'Tags', url: '/admin/tags' },
      { label: tag?.name || 'Detalhes' }
    ]"
    [actions]="[
      {
        label: 'Editar',
        icon: 'edit',
        variant: 'primary',
        callback: () => editTag()
      }
    ]">
  </app-page-header>

  <div class="container mx-auto px-4 py-6" *ngIf="tag">
    <app-card>
      <div class="space-y-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Nome</label>
          <p class="mt-1 text-gray-900">{{ tag.name }}</p>
        </div>
        <div *ngIf="tag.color">
          <label class="text-sm font-medium text-gray-700">Cor</label>
          <p class="mt-1">
            <span 
              class="inline-block w-6 h-6 rounded-full mr-2"
              [style.backgroundColor]="tag.color">
            </span>
            {{ tag.color }}
          </p>
        </div>
        <div *ngIf="tag.products_count !== undefined">
          <label class="text-sm font-medium text-gray-700">Número de Produtos</label>
          <p class="mt-1 text-gray-900">{{ tag.products_count }}</p>
        </div>
      </div>
    </app-card>
  </div>
</div>
