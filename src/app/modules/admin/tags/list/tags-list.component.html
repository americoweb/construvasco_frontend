<div class="tags-list-container w-full">
  <app-page-header
    [title]="'Tags'"
    [subtitle]="'Gerencie as tags de produtos'"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar tags...'"
    [searchValue]="searchValue"
    [actions]="pageHeaderActions"
    [loading]="loading"
    (searchChange)="onSearchChange($event)"
    (refresh)="onRefresh()">
  </app-page-header>

  <div class="container mx-auto px-4 py-6">
    <app-data-table
      [data]="tags"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading"
      [emptyMessage]="'Nenhuma tag encontrada'"
      (rowClick)="viewTag($event)">
    </app-data-table>

    <div class="mt-4">
      <app-pagination
        [pagination]="pagination"
        [pageSizeOptions]="[10, 15, 25, 50]"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
