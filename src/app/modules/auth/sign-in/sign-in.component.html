<div class="auth-sign-in-shell flex flex-col md:flex-row min-h-screen bg-gray-50">

  <!-- Painel esquerdo — formulário -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-8 lg:p-12">
    <div class="w-full max-w-md">

      <div class="mb-8 text-center md:text-left">
        <div class="inline-flex items-center justify-center mb-4">
          <span class="brand-wordmark text-2xl" aria-label="Construvasco">
            <span class="brand-wordmark__mark">C</span><span>onstruvasco</span>
          </span>
        </div>
        <h1 class="text-lg sm:text-xl font-bold text-gray-900 whitespace-nowrap">
          Bem-vindo à <span class="auth-sign-in-panel-accent">Construvasco</span>
        </h1>
        <p class="text-gray-600 mt-2">
          Plataforma de projectos de obra e arquitectura
        </p>
      </div>

      <div *ngIf="showAlert" class="mb-6">
        <fuse-alert
          [appearance]="'outline'"
          [showIcon]="false"
          [type]="alert.type"
        >
          {{ alert.message }}
          <ng-container *ngIf="action && redirect">
            <a [routerLink]="[redirect]" class="ml-2 auth-sign-in-panel-accent font-medium hover:underline">{{ action }}</a>
          </ng-container>
        </fuse-alert>
      </div>

      <div class="mb-6">
        <div id="googleSignInButton" class="flex justify-center min-h-[44px]"></div>
      </div>

      <div class="flex items-center mb-6">
        <div class="flex-1 border-t border-gray-300"></div>
        <span class="px-3 text-sm text-gray-500">ou</span>
        <div class="flex-1 border-t border-gray-300"></div>
      </div>

      <form
        [formGroup]="signInForm"
        #signInNgForm="ngForm"
        (ngSubmit)="onSubmit()"
      >
        <mat-form-field class="w-full mb-4" appearance="outline">
          <mat-label>Email</mat-label>
          <input
            id="identifier"
            matInput
            type="email"
            formControlName="identifier"
            autocomplete="username"
            placeholder="seu@email.com"
          />
          <mat-icon class="icon-size-5" matSuffix [svgIcon]="'heroicons_solid:envelope'"></mat-icon>
          <mat-error *ngIf="signInForm.get('identifier')?.hasError('required')">
            Email é obrigatório
          </mat-error>
        </mat-form-field>

        <mat-form-field class="w-full mb-2" appearance="outline">
          <mat-label>Senha</mat-label>
          <input
            id="password"
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar senha' : 'Ocultar senha'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="signInForm.get('password')?.hasError('required')">
            Senha é obrigatória
          </mat-error>
        </mat-form-field>

        <div class="mt-2">
          <mat-checkbox formControlName="remember_me" class="-ml-2 text-gray-600">
            Lembrar-me
          </mat-checkbox>
        </div>

        <button
          class="fuse-mat-button-large auth-sign-in-btn-primary w-full mt-6"
          mat-flat-button
          type="submit"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading" class="flex items-center justify-center gap-2">
            <mat-icon class="icon-size-5">login</mat-icon>
            Entrar no sistema
          </span>
          <mat-progress-spinner
            *ngIf="isLoading"
            [diameter]="24"
            [mode]="'indeterminate'"
            class="inline-block"
          ></mat-progress-spinner>
        </button>

        <p class="text-center text-gray-600 text-sm mt-6">
          Ainda não tem conta?
          <a
            class="font-medium auth-sign-in-panel-accent hover:underline ml-1"
            [routerLink]="['/auth/sign-up']"
          >
            Criar conta
          </a>
        </p>
      </form>
    </div>
  </div>

  <!-- Painel direito — imagem (desktop) -->
  <div class="hidden md:block md:w-1/2 relative overflow-hidden auth-sign-in-hero-gradient">
    <div class="absolute inset-0 opacity-10 mix-blend-overlay pointer-events-none">
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <pattern id="construvasco-grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M0 48 V0 H48" stroke="white" stroke-width="0.5" fill="none" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#construvasco-grid)" />
      </svg>
    </div>

    <div class="absolute inset-0 flex items-center justify-center p-10 lg:p-12">
      <div class="relative w-full h-full min-h-[420px] rounded-3xl overflow-hidden shadow-2xl">
        <img
          src="images/auth/architecture-hero.jpg"
          alt="Projecto de arquitectura e construção"
          class="w-full h-full object-cover"
          style="object-position: center 40%;"
          loading="lazy"
        />
        <div class="absolute inset-0 auth-sign-in-hero-overlay"></div>
        <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
          <p class="text-xs uppercase tracking-[0.2em] text-[var(--app-warning)] font-semibold mb-2">Construvasco</p>
          <p class="text-xl lg:text-2xl font-bold leading-tight">
            Projectos de obra com clareza do briefing à entrega.
          </p>
        </div>
      </div>
    </div>

    <div class="absolute top-10 right-10 w-40 h-40 bg-[#F2C94C] opacity-15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 left-10 w-60 h-60 bg-slate-900 opacity-30 rounded-full blur-3xl pointer-events-none"></div>
  </div>

</div>
