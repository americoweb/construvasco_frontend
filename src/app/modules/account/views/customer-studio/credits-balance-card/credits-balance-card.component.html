<div class="credits-card" [class.credits-card--low]="balance <= 2">
  <div class="credits-card__glow" aria-hidden="true"></div>
  <span class="credits-card__icon-wrap">
    <mat-icon class="credits-card__icon" svgIcon="heroicons_outline:sparkles" />
  </span>
  <div class="credits-card__body">
    <p class="credits-card__label">Créditos IA</p>
    <p class="credits-card__value">{{ balance }}</p>
    <p class="credits-card__hint">{{ costPerGeneration }} crédito por geração ou refinamento</p>
    @if (balance <= 2) {
      <p class="credits-card__alert">Saldo baixo — contacte a equipa para recarregar.</p>
    }
  </div>
</div>
