<div class="studio-refs">
  <label class="studio-refs__drop" [class.studio-refs__drop--busy]="uploading">
    <span class="studio-refs__drop-icon">
      <mat-icon svgIcon="heroicons_outline:arrow-up-tray" />
    </span>
    <span class="studio-refs__drop-title">Arraste ou escolha imagens</span>
    <span class="studio-refs__drop-hint">Terreno, fachadas ou inspiração — JPG ou PNG</span>
    <input
      type="file"
      accept="image/*"
      multiple
      class="studio-refs__input"
      (change)="onFiles($event)"
      [disabled]="uploading"
    />
  </label>

  @if (uploading) {
    <p class="studio-refs__status">
      <mat-icon svgIcon="heroicons_outline:arrow-path" class="studio-refs__spin" />
      A enviar ficheiros…
    </p>
  }

  @if (documents.length) {
    <ul class="studio-refs__list" aria-label="Ficheiros carregados">
      @for (doc of documents; track doc.id) {
        <li class="studio-refs__item">
          <mat-icon svgIcon="heroicons_outline:photo" />
          <span>{{ doc.original_name || 'Imagem' }}</span>
        </li>
      }
    </ul>
  }
</div>
