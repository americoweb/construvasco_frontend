<div class="saved-designs-container">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Designs Salvos</h1>
    <a
      routerLink="/produtos"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
      Criar Novo Design
    </a>
  </div>

  <div *ngIf="designs.length === 0" class="text-center py-12 text-gray-500">
    <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
    </svg>
    <p class="text-lg">Ainda não tem designs salvos</p>
    <p class="text-sm mt-2">Comece criando seu primeiro design personalizado</p>
  </div>

  <div *ngIf="designs.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Design cards will be displayed here -->
  </div>
</div>
