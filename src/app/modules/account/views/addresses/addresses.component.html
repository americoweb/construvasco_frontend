<div class="addresses-container w-full">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Endereços</h1>
    <button
      (click)="addNewAddress()"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
      Adicionar Novo Endereço
    </button>
  </div>

  <!-- Address Form -->
  <div *ngIf="showForm" class="bg-white rounded-lg shadow-lg border border-gray-200 p-6 mb-6">
    <h2 class="text-xl font-bold text-gray-900 mb-4">
      {{ editingAddress ? 'Editar Endereço' : 'Novo Endereço' }}
    </h2>
    <form [formGroup]="addressForm" (ngSubmit)="saveAddress()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
          <input formControlName="full_name" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
          <input formControlName="phone" type="tel" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        </div>
      </div>
      <div>
        <label class="flex items-center gap-2">
          <input formControlName="whatsapp" type="checkbox" class="w-4 h-4">
          <span class="text-sm text-gray-700">Usar WhatsApp (mesmo número)</span>
        </label>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Morada Linha 1</label>
        <input formControlName="address_line_1" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Morada Linha 2</label>
        <input formControlName="address_line_2" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
          <input formControlName="city" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Província</label>
          <select formControlName="province" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            <option value="">Selecione</option>
            <option *ngFor="let prov of provinces" [value]="prov">{{ prov }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Código Postal</label>
          <input formControlName="postal_code" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        </div>
      </div>
      <div>
        <label class="flex items-center gap-2">
          <input formControlName="is_primary" type="checkbox" class="w-4 h-4">
          <span class="text-sm text-gray-700">Definir como endereço principal</span>
        </label>
      </div>
      <div class="flex gap-4">
        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          Guardar
        </button>
        <button type="button" (click)="cancelForm()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- Addresses List -->
  <div *ngIf="addresses.length === 0 && !showForm" class="text-center py-12 text-gray-500">
    <p>Nenhum endereço cadastrado</p>
  </div>

  <div *ngIf="addresses.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Address cards will be displayed here -->
  </div>
</div>
