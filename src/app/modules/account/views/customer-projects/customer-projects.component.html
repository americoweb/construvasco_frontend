<h1 class="text-2xl font-bold text-slate-900 mb-6">Meus projectos</h1>

@if (loading) {
  <div class="flex justify-center py-12">
    <mat-spinner diameter="36" />
  </div>
} @else if (!rows.length) {
  <mat-card>
    <mat-card-content class="!py-10 text-center text-slate-500">
      Ainda não tem projectos activos. Após aceitar um orçamento, o projecto aparecerá aqui.
    </mat-card-content>
  </mat-card>
} @else {
  <div class="space-y-4">
    @for (p of rows; track p.id) {
      <mat-card>
        <mat-card-content class="!py-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="font-semibold">{{ p.name || 'Projecto #' + p.id }}</p>
            <p class="text-sm text-slate-500">
              {{ phaseLabel(p) }} · {{ p.location || '—' }}
            </p>
          </div>
          <a mat-stroked-button [routerLink]="['/conta/projectos', p.id]">Ver detalhes</a>
        </mat-card-content>
      </mat-card>
    }
  </div>
}
