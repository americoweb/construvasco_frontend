<div class="payment-methods-container">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Métodos de Pagamento</h1>
    <button
      (click)="addPaymentMethod()"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
      Adicionar Método
    </button>
  </div>

  <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
    <p class="text-sm text-blue-800">
      <strong>Pagamento seguro e encriptado</strong> - Seus dados de pagamento são protegidos com segurança de nível bancário.
    </p>
  </div>

  <div *ngIf="paymentMethods.length === 0" class="text-center py-12 text-gray-500">
    <p>Nenhum método de pagamento cadastrado</p>
  </div>

  <div *ngIf="paymentMethods.length > 0" class="space-y-4">
    <!-- Payment method cards will be displayed here -->
  </div>
</div>
