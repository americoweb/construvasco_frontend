<div class="account-container min-h-screen bg-gray-50 flex flex-col w-full">
  <app-landing-header [cartItemCount]="0" [orderHistoryCount]="0"></app-landing-header>
  
  <!-- Desktop Layout: Sidebar + Content -->
  <div class="hidden md:flex flex-1">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 h-screen sticky top-0 self-start overflow-hidden">
      <app-account-sidebar></app-account-sidebar>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-5 lg:p-6">
      <router-outlet (activate)="onRouteActivate($event)" (deactivate)="onRouteDeactivate($event)"></router-outlet>
    </main>
  </div>

  <!-- Mobile Layout: Content Only (Bottom Tabs) -->
  <div class="md:hidden flex-1">
    <main class="pb-20">
      <router-outlet (activate)="onRouteActivate($event)" (deactivate)="onRouteDeactivate($event)"></router-outlet>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40">
      <div class="flex justify-around items-center h-16">
        <a
          routerLink="/conta/dashboard"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex flex-col items-center justify-center flex-1 text-gray-600 hover:text-blue-600 transition-colors">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="text-xs">Dashboard</span>
        </a>

        <a
          routerLink="/conta/pedidos"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex flex-col items-center justify-center flex-1 text-gray-600 hover:text-blue-600 transition-colors">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <span class="text-xs">Pedidos</span>
        </a>

        <a
          routerLink="/conta/designs"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex flex-col items-center justify-center flex-1 text-gray-600 hover:text-blue-600 transition-colors">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span class="text-xs">Designs</span>
        </a>

        <a
          routerLink="/conta/definicoes"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex flex-col items-center justify-center flex-1 text-gray-600 hover:text-blue-600 transition-colors">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="text-xs">Definições</span>
        </a>
      </div>
    </nav>
  </div>
  
</div>
