@if (rows.length) {
  <section class="portal-panel briefing-panel">
    <h2 class="portal-panel__title">
      <mat-icon svgIcon="heroicons_outline:clipboard-document-list" />
      {{ title }}
    </h2>
    <dl class="briefing-panel__dl">
      @for (row of rows; track row.label) {
        <div class="briefing-panel__row">
          <dt>{{ row.label }}</dt>
          <dd>{{ row.value }}</dd>
        </div>
      }
    </dl>
  </section>
}
