<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation?.default || []"
    [opened]="!isScreenSmall"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <div class="flex w-full items-center p-4 pl-6">
            <a routerLink="/admin/dashboard" class="brand-wordmark brand-wordmark--on-dark" aria-label="Construvasco">
                <span class="brand-wordmark__mark">C</span><span>onstruvasco</span>
            </a>
        </div>
        <!-- User -->
        <div class="flex w-full flex-col items-center p-4" *ngIf="user">
            <div class="relative h-24 w-24">
                <app-avatar
                    [name]="user.name"
                    [size]="24"
                    [src]="userAvatarUrl">
                </app-avatar>
            </div>
            <div class="mt-4 flex w-full flex-col items-center justify-center">
                <div
                    class="w-full overflow-hidden text-ellipsis whitespace-nowrap text-center text-sm font-medium leading-snug"
                >
                    {{ user.name }}
                </div>
                <div
                    class="text-secondary mt-0.5 w-full overflow-hidden text-ellipsis whitespace-nowrap text-center text-xs font-normal leading-snug"
                >
                    {{ user.identifier }}
                </div>
            </div>
        </div>
    </ng-container>
    <!-- Navigation footer hook -->
    <ng-container fuseVerticalNavigationContentFooter>
        <div class="mb-4 mt-2 flex h-16 flex-0 items-center justify-center pl-2 pr-6">
            <span class="brand-wordmark brand-wordmark--on-dark brand-wordmark--footer" aria-hidden="true">
                <span class="brand-wordmark__mark">C</span><span>onstruvasco</span>
            </span>
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-6 shadow dark:border-b dark:bg-transparent dark:shadow-none print:hidden"
    >
        <!-- Navigation toggle button -->
        <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
            <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <div class="ml-auto flex items-center space-x-0.5 pl-2 sm:space-x-2">
            <languages></languages>
            <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
            <search [appearance]="'bar'"></search>
            <shortcuts></shortcuts>
            <messages></messages>
            <notifications></notifications>
            <user [showAvatar]="true"></user>
        </div>
    </div>

    <!-- Content — 1.5rem lateral margin (aligned with /conta) -->
    <div class="staff-main flex min-w-0 w-full flex-auto flex-col px-6 py-5 lg:py-6">
        <router-outlet></router-outlet>
    </div>
</div>
